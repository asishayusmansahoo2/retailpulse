version: '3.8'

services:
  # Service 1: Our Streamlit Dashboard
  streamlit_app:
    build: .
    container_name: retailpulse_dashboard
    ports:
      - "8501:8501"
    volumes:
      # Mount local folders so the container can read/write our data
      - ./data:/app/data
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow_server

  # Service 2: MLflow Tracking Server
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: retailpulse_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri /mlruns --default-artifact-root /mlruns --host 0.0.0.0
    volumes:
      - ./mlruns:/mlruns